[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autobuild-json-cockplit-tools"
version = "0.1.0"
description = "Local HTTP OAuth batch workbench"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3", "curl_cffi>=0.16,<1", "pyotp>=2.9,<3", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1.2,<2"]
proxy = ["httpx[socks]>=0.28,<1"]
service = ["sqlalchemy>=2.0,<3", "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2", "httpx[socks]>=0.28,<1", "cryptography>=44", "wsproto>=1.2,<2", "python-multipart>=0.0.20,<1", "websockets>=15,<17"]
gateway-test = ["pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["autobuild_json*"]

[tool.setuptools.package-data]
autobuild_json = ["static/*"]
"autobuild_json.gateway.admin" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires a dedicated PostgreSQL test server"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
